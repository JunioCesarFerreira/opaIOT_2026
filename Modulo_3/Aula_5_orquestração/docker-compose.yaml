name: opaiot-p5

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      # Configuração aberta e sem autenticação apenas para laboratório local.
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  kafka:
    # Versão fixada para evitar que mudanças futuras do "latest" quebrem a prática.
    image: apache/kafka:4.3.0
    hostname: kafka
    ports:
      # Listener para ferramentas executadas no host: kafka-topics, Kafka UI externo, scripts locais.
      - "9092:9092"
    environment:
      # Broker e controller no mesmo container: configuração KRaft single-node, sem ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # PLAINTEXT é o listener interno da rede Docker; PLAINTEXT_HOST é o acesso pelo host.
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # Como há apenas um broker, todos os tópicos internos precisam de fator de replicação 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Limita o heap para rodar melhor em notebooks e VMs pequenas.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      # Volume persistente para manter offsets e mensagens entre reinícios da stack.
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      # Usa o listener interno anunciado aos containers; evita confundir localhost do container com localhost do host.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 45s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.0
    depends_on:
      kafka:
        condition: service_healthy
    # Job curto: cria o tópico da prática antes das aplicações Python produzirem/consumirem.
    command:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic "${KAFKA_TOPIC:-iot.telemetry}" \
          --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --describe \
          --topic "${KAFKA_TOPIC:-iot.telemetry}"
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: opaiot-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
    restart: unless-stopped

  sensor-simulator:
    build: ./services/sensor-simulator
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: ${SENSOR_MQTT_TOPIC:-iot/device-001/telemetry}
      DEVICE_ID: ${DEVICE_ID:-device-001}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-2}
    restart: unless-stopped

  mqtt-to-kafka:
    build: ./services/mqtt-to-kafka
    depends_on:
      mosquitto:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: ${BRIDGE_MQTT_TOPIC:-iot/+/telemetry}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-iot.telemetry}
    restart: unless-stopped

  iot-processor:
    build: ./services/iot-processor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-iot.telemetry}
      KAFKA_GROUP_ID: iot-processor
      METRICS_PORT: 8000
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      iot-processor:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      # Prometheus coleta apenas o endpoint /metrics exposto pelo processador Python.
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      # Provisionamento automático: datasource Prometheus e dashboard da prática.
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  kafka-data:
  prometheus-data:
  grafana-data:
